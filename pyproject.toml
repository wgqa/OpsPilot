[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot read-only investigation and evidence-gated support workflow"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.4.1",
    "langchain-openai==1.7.2",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
